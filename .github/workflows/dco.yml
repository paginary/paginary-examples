name: DCO

# This workflow checks that every commit in this public repository carries a DCO sign-off.
# The check runs for pull requests and pushes so unsigned history is reported promptly.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for the commit range)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Every commit carries a Signed-off-by trailer
        env:
          # `pull_request` carries the branch point and tip; `push` carries the range
          # it advanced. On a push the fields are absent, which is falsy, so the
          # fallback picks the push pair.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.after }}
        run: |
          set -euo pipefail
          # A branch's first push, or a force push, gives a base we cannot resolve.
          # Check the tip alone rather than skipping the run silently.
          if [ -z "${BASE:-}" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "base $BASE is not in this history — checking the tip commit only."
            range="-1 $HEAD"
          else
            range="$BASE..$HEAD"
          fi
          missing=0
          # Merge commits are excluded: they carry no authored content of their own.
          for sha in $(git rev-list --no-merges $range); do
            if ! git log -1 --format=%B "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::commit $sha has no Signed-off-by trailer"
              echo "  $(git log -1 --format='%h %s' "$sha")"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "$missing commit(s) missing a sign-off. Fix with: git rebase --signoff $BASE && git push --force-with-lease"
            exit 1
          fi
          echo "all commits signed off."
